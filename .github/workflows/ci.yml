name: Continuous Integration & Security Pipeline

on:
  push:
    branches: [ development, main, master ]
  pull_request:
    branches: [ development, main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Code Quality & Type Check
  # ============================================================================
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Backend TypeScript Compilation Check
        run: npm run lint --prefix backend

      - name: Frontend TypeScript Compilation Check
        run: npm run lint --prefix frontend

  # ============================================================================
  # 2. Vulnerability & Security Audit
  # ============================================================================
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend Dependency Vulnerability Scan
        run: |
          echo "Scanning backend dependencies for known vulnerabilities..."
          npm audit --prefix backend --audit-level=critical || echo "Vulnerabilities detected - check advisory report"

      - name: Frontend Dependency Vulnerability Scan
        run: |
          echo "Scanning frontend dependencies for known vulnerabilities..."
          npm audit --prefix frontend --audit-level=critical || echo "Vulnerabilities detected - check advisory report"

      - name: Repository Secret & Credentials Scan
        run: |
          echo "Scanning for accidental hardcoded secrets or credentials..."
          # Verify no private keys or unmasked production tokens committed
          ! grep -rnE "BEGIN (RSA|OPENSSH|DSA|EC) PRIVATE KEY" . --exclude-dir={.git,node_modules,dist} || (echo "Private key detected!" && exit 1)
          echo "✓ Secret scan passed."

  # ============================================================================
  # 3. Unit Tests (Backend & Frontend)
  # ============================================================================
  unit-tests:
    name: Unit Test Suites
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Execute Backend Unit Tests
        run: npm run test:unit --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uptime_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_jwt_secret_key_12345
          NODE_ENV: test

      - name: Execute Frontend Unit Tests
        run: npm run test --prefix frontend
        env:
          NODE_ENV: test

  # ============================================================================
  # 4. Integration Tests (with PostgreSQL & Redis Service Containers)
  # ============================================================================
  integration-tests:
    name: API & Service Integration Tests
    runs-on: ubuntu-latest
    needs: [code-quality]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: uptime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: Execute End-to-End API Integration Tests
        run: npm run test:integration --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/uptime_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_integration_secret_jwt_key
          NODE_ENV: test

  # ============================================================================
  # 5. Production Build Verification
  # ============================================================================
  build-verification:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Build Backend Production Distribution
        run: npm run build --prefix backend

      - name: Build Frontend Production Distribution
        run: npm run build --prefix frontend
